name: Build Muses Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Build Windows EXE
        env:
          NODE_ENV: production
        run: npm run electron:build:win

      - name: Compress installers (GitHub side)
        shell: bash
        run: |
          cd dist_electron
          shopt -s nullglob
          files=( Muses_Setup_*.exe Muses_v*.zip *.blockmap latest*.yml )
          if [ ${#files[@]} -eq 0 ]; then echo "No installer output"; exit 1; fi
          ls -lh "${files[@]}"
          tar -czf muses-windows.tar.gz "${files[@]}"
          ls -lh muses-windows.tar.gz

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: muses-windows
          path: dist_electron/muses-windows.tar.gz
          if-no-files-found: error
