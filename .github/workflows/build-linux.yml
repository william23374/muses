name: Build Muses Linux

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Build Linux packages
        env:
          NODE_ENV: production
        run: npm run electron:build:linux

      - name: Compress installers (GitHub side)
        shell: bash
        run: |
          cd dist_electron
          shopt -s nullglob
          files=( Muses*.AppImage Muses*.deb *.blockmap latest*.yml )
          if [ ${#files[@]} -eq 0 ]; then echo "No linux packages produced"; exit 1; fi
          ls -lh "${files[@]}"
          tar -czf muses-linux.tar.gz "${files[@]}"
          ls -lh muses-linux.tar.gz

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: muses-linux
          path: dist_electron/muses-linux.tar.gz
          if-no-files-found: error
