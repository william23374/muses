<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>验证码验证</title>
    <style>
      /* ========== Global reset ========== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ========== Page body: full-screen center + gradient background ========== */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e0ecff 0%, #f5f0ff 50%, #fce4ec 100%);
      }

      /* ========== Card container: frosted glass effect ========== */
      .login-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        padding: 48px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 32px rgba(100, 120, 180, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
        transition: max-width 0.3s ease;
      }

      /* Widen card when step 2 expands */
      .login-card.wide {
        max-width: 600px;
      }

      /* ========== Title area ========== */
      .login-header {
        text-align: center;
        margin-bottom: 36px;
      }
      .login-header h1 {
        font-size: 26px;
        font-weight: 600;
        color: #1a1a2e;
        letter-spacing: 0.5px;
      }
      .login-header p {
        font-size: 14px;
        color: #7c8db5;
        margin-top: 8px;
      }

      /* ========== Form fields ========== */
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #4a5568;
        margin-bottom: 8px;
      }
      .form-group input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        color: #1a1a2e;
        background: #f7f9fc;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        outline: none;
        transition: all 0.25s ease;
      }
      .form-group input::placeholder {
        color: #a0aec0;
      }
      .form-group input:focus {
        border-color: #6c8cff;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
      }

      /* ========== Inline form (two-column layout) ========== */
      .form-row {
        display: flex;
        gap: 12px;
      }
      .form-row .form-group {
        flex: 1;
      }

      /* ========== Primary button ========== */
      .login-btn {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #6c8cff 0%, #a78bfa 100%);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }
      .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(108, 140, 255, 0.35);
      }
      .login-btn:active {
        transform: translateY(0);
      }
      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* ========== Captcha container ========== */
      .captcha-box {
        margin-top: 24px;
      }

      /* ========== SMS captcha area (hidden by default) ========== */
      .sms-captcha {
        margin-top: 24px;
        display: none;
      }
      .sms-captcha .form-group {
        margin-bottom: 16px;
      }
      .sms-captcha .verify-btn {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #6c8cff 0%, #a78bfa 100%);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }
      .sms-captcha .verify-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(108, 140, 255, 0.35);
      }

      /* ========== Result message ========== */
      .result {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 13px;
        display: none;
      }
      .result.ok {
        background: #f6ffed;
        color: #52c41a;
        border: 1px solid #b7eb8f;
      }
      .result.err {
        background: #fff2f0;
        color: #ff4d4f;
        border: 1px solid #ffccc7;
      }

      /* ========== Verification info panel ========== */
      .verify-info {
        margin-top: 12px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        font-size: 12px;
        color: #666;
        display: none;
      }
      .verify-info .vi-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 2px 0;
      }
      .verify-info .vi-label {
        color: #999;
        flex-shrink: 0;
      }
      .verify-info .vi-value {
        color: #333;
        font-family: monospace;
        text-align: right;
        max-width: 72%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ========== Back link ========== */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 20px;
        font-size: 14px;
        color: #7c8db5;
        text-decoration: none;
        transition: color 0.25s ease;
      }
      .back-link:hover {
        color: #6c8cff;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <!-- Page title -->
      <div class="login-header">
        <h1>验证码验证</h1>
        <p>腾讯验证码 / 手机短信验证</p>
      </div>

      <!-- ========== Step 1: Enter eventid / ssaCode ========== -->
      <div id="step1">
        <div class="form-group">
          <label>eventid / ssaCode</label>
          <label for="eventidInput"></label><input type="text" id="eventidInput" placeholder="请输入 eventid / ssaCode" autocomplete="off" />
        </div>
        <button class="login-btn" id="getInfoBtn">获取验证信息</button>
        <div class="result" id="step1Result" style="display: none; margin-top: 12px"></div>
      </div>

      <!-- ========== Step 2: Show verification info + device params, trigger captcha manually ========== -->
      <div id="step2" style="display: none">
        <!-- Verification info panel (sessionid, v_type, txappid, etc.) -->
        <div class="verify-info" id="verifyInfo"></div>

        <!-- Device params: mid, userid, dfid, webgl (pre-filled from cookies, editable) -->
        <div class="form-row">
          <div class="form-group">
            <label>mid</label>
            <label for="midInput"></label><input type="text" id="midInput" />
          </div>
          <div class="form-group">
            <label>userid</label>
            <label for="useridInput"></label><input type="text" id="useridInput" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>dfid</label>
            <label for="dfidInput"></label><input type="text" id="dfidInput" />
          </div>
          <div class="form-group">
            <label>webgl</label>
            <label for="webglInput"></label><input type="text" id="webglInput" />
          </div>
        </div>

        <!-- Trigger captcha button -->
        <button class="login-btn" id="triggerCaptchaBtn"></button>

        <!-- Tencent captcha mount container -->
        <div class="captcha-box" id="captchaBox"></div>

        <!-- SMS captcha input area -->
        <div class="sms-captcha" id="smsCaptcha">
          <div class="form-group">
            <label>验证码</label>
            <label for="smsCode"></label><input type="text" id="smsCode" placeholder="请输入验证码" maxlength="6" />
          </div>
          <button class="verify-btn" id="smsVerifyBtn">验证</button>
        </div>

        <!-- Verification result message -->
        <div class="result" id="result"></div>
      </div>

      <a class="back-link" href="./index.html">← 返回首页</a>
    </div>

    <!-- Import behavioral fingerprint generator -->
    <script src="./fingerprint.js"></script>
    <script>
      /**
       * ============================================================
       * Captcha verification page
       * ============================================================
       *
       * Two-step flow:
       * 1. Enter eventid/ssaCode → call /get/verify/info to fetch verification info
       * 2. Show device params (mid/userid/dfid/webgl, pre-filled from cookies) → trigger captcha manually
       *
       * Supported verification types:
       * - v_type=23: Tencent graphical captcha
       * - v_type=32: SMS captcha
       */

      // ========== Destructure utility functions from fingerprint.js ==========
      const { generateWebGLHash, generateEDTData, encryptSid, hexToBase64, ri } = fingerprint;

      // ========== DOM element references ==========
      const eventidInput = document.getElementById('eventidInput'); // eventid input field
      const getInfoBtn = document.getElementById('getInfoBtn'); // fetch verification info button
      const step1Result = document.getElementById('step1Result'); // step 1 result message
      const step1 = document.getElementById('step1'); // step 1 container
      const step2 = document.getElementById('step2'); // step 2 container
      const verifyInfoEl = document.getElementById('verifyInfo'); // verification info panel
      const midInput = document.getElementById('midInput'); // device MID input field
      const useridInput = document.getElementById('useridInput'); // user ID input field
      const dfidInput = document.getElementById('dfidInput'); // device fingerprint ID input field
      const webglInput = document.getElementById('webglInput'); // WebGL fingerprint input field
      const triggerCaptchaBtn = document.getElementById('triggerCaptchaBtn'); // trigger captcha button
      const captchaBox = document.getElementById('captchaBox'); // Tencent captcha container
      const smsCaptcha = document.getElementById('smsCaptcha'); // SMS captcha area
      const smsCode = document.getElementById('smsCode'); // SMS captcha input field
      const smsVerifyBtn = document.getElementById('smsVerifyBtn'); // SMS verify button
      const resultEl = document.getElementById('result'); // verification result message

      // ========== Cached verification info ==========
      let currentEventid = ''; // current eventid
      let currentTxappid = ''; // Tencent captcha app ID
      let currentVtype = 0; // verification type (23=Tencent, 32=SMS)

      /**
       * Read a cookie value by name
       * @param {string} name - cookie key name
       * @returns {string} cookie value, or '0' if missing
       */
      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : '0';
      }

      /**
       * Show step 1 result message
       * @param {boolean} ok - whether the operation succeeded
       * @param {string} text - message text
       */
      function showStep1Result(ok, text) {
        step1Result.style.display = 'block';
        step1Result.className = 'result ' + (ok ? 'ok' : 'err');
        step1Result.textContent = text;
      }

      /**
       * Show step 2 verification result message
       * @param {boolean} ok - whether the operation succeeded
       * @param {string} text - message text
       */
      function showResult(ok, text) {
        resultEl.style.display = 'block';
        resultEl.className = 'result ' + (ok ? 'ok' : 'err');
        resultEl.textContent = text;
      }

      /**
       * Dynamically load an external JS script
       * @param {string} url - script URL
       * @param {function} cb - callback on load success/failure
       */
      function loadScript(url, cb) {
        const s = document.createElement('script');
        s.src = url;
        s.onload = function () {
          cb();
        };
        s.onerror = function () {
          cb(new Error('load failed'));
        };
        document.head.appendChild(s);
      }

      /**
       * ============================================================
       * Step 1: Fetch verification info
       * ============================================================
       *
       * Calls /get/verify/info to fetch verification details (sessionid, v_type, txappid, etc.),
       * then switches to step 2 and shows device param inputs.
       */
      async function fetchVerifyInfo() {
        const eventid = eventidInput.value.trim();
        if (!eventid) {
          eventidInput.focus();
          return;
        }

        // Button state: disabled + label set to "Fetching..."
        getInfoBtn.disabled = true;
        getInfoBtn.textContent = '获取中...';
        step1Result.style.display = 'none';

        try {
          // Call server to fetch verification info
          const data = await fetch(`/get/verify/info?eventid=${encodeURIComponent(eventid)}`).then((r) => r.json());
          console.log('Verify Info:', data);

          // API returned failure
          if (!data.data) {
            showStep1Result(false, '获取失败: ' + (data.error_msg || JSON.stringify(data)));
            getInfoBtn.disabled = false;
            getInfoBtn.textContent = '获取验证信息';
            return;
          }

          const info = data.data;

          // Cache verification info
          currentEventid = eventid;
          currentTxappid = info.txappid || '';
          currentVtype = info.v_type || 0;

          // Render verification info panel
          verifyInfoEl.innerHTML = [
            { label: 'sessionid', value: info.sessionid },
            { label: 'v_type', value: info.v_type },
            { label: 'txappid', value: info.txappid },
            { label: 'business', value: info.business },
            { label: 'url', value: info.url },
          ]
            .map(
              (item) =>
                `<div class="vi-row">` +
                `<span class="vi-label">${item.label}</span>` +
                `<span class="vi-value" title="${item.value || ''}">${item.value || '-'}</span>` +
                `</div>`
            )
            .join('');
          verifyInfoEl.style.display = 'block';

          // Pre-fill device params from cookies; default to '0' if missing
          midInput.value = getCookie('KUGOU_API_MID') || '0';
          useridInput.value = getCookie('userid') || '0';
          dfidInput.value = getCookie('dfid') || '0';

          // WebGL fingerprint: prefer cookie, otherwise generate via generateWebGLHash
          const webglCookie = getCookie('KUGOU_API_WEBGL');
          webglInput.value = webglCookie && webglCookie !== '0' ? webglCookie : generateWebGLHash();

          // Set button label based on verification type
          if (currentVtype === 23) {
            triggerCaptchaBtn.textContent = '打开腾讯验证码';
          } else if (currentVtype === 32) {
            triggerCaptchaBtn.textContent = '发送短信验证码';
          } else {
            triggerCaptchaBtn.textContent = '未知验证类型: ' + currentVtype;
            triggerCaptchaBtn.disabled = true;
          }

          // Switch to step 2 and widen the card
          step1.style.display = 'none';
          step2.style.display = 'block';
          document.querySelector('.login-card').classList.add('wide');
        } catch (e) {
          console.error('fetchVerifyInfo error:', e);
          showStep1Result(false, '请求失败: ' + e.message);
          getInfoBtn.disabled = false;
          getInfoBtn.textContent = '获取验证信息';
        }
      }

      /**
       * ============================================================
       * Generate SID/EDT encrypted data
       * ============================================================
       *
       * Reads device params from inputs, generates simulated behavioral fingerprint data, and encrypts:
       * - SID: RSA-OAEP encrypted AES key (Base64)
       * - EDT: AES-128-CBC encrypted behavioral data (Base64)
       *
       * @returns {Promise<{sid: string, edt: string}>}
       */
      async function generateSidEdt() {
        const mid = midInput.value.trim() || '0';
        const userid = useridInput.value.trim() || '0';
        const dfid = dfidInput.value.trim() || '0';
        const webglHash = webglInput.value.trim() || generateWebGLHash();

        // Randomize mouse trajectory parameters
        const points = ri(30, 60); // sample point count
        const startX = ri(200, 600); // start X
        const startY = ri(200, 500); // start Y
        const endX = ri(500, 700); // end X
        const endY = ri(80, 150); // end Y

        const ts = Date.now();

        // Generate simulated behavioral data (mouse trajectory + scroll + window events)
        const data = generateEDTData({ startX, startY, endX, endY, mousePoints: points });

        // Build plaintext: mid=xxx;userid=xxx;dfid=xxx;webgl=xxx;webdriver=0;ts=xxx;data=xxx
        const sidPlaintext = `mid=${mid};userid=${userid};dfid=${dfid};webgl=${webglHash};webdriver=0;ts=${ts};data=${data}`;

        // AES-encrypt plaintext to get EDT; RSA-encrypt AES key to get SID
        const result = await encryptSid(sidPlaintext);
        return {
          sid: hexToBase64(result.rsaCiphertextHex),
          edt: hexToBase64(result.aesCiphertextHex),
        };
      }

      /**
       * ============================================================
       * Trigger captcha (dispatch by v_type)
       * ============================================================
       */
      async function triggerCaptcha() {
        triggerCaptchaBtn.disabled = true;
        resultEl.style.display = 'none';

        // Generate sid/edt
        const { sid, edt } = await generateSidEdt();
        console.log({ sid, edt });

        // Dispatch by verification type
        if (currentVtype === 23) {
          startTxCaptcha(currentEventid, currentTxappid, sid, edt);
        } else if (currentVtype === 32) {
          startSmsCaptcha(currentEventid, currentVtype, sid, edt);
        }
      }

      /**
       * ============================================================
       * Tencent graphical captcha flow (v_type=23)
       * ============================================================
       *
       * 1. Dynamically load TCaptcha.js SDK
       * 2. Create TencentCaptcha instance and show it
       * 3. After user passes, submit ticket/randstr as verifycode to the server
       *
       * @param {string} eventid - verification event ID
       * @param {string} txappid - Tencent captcha app ID
       * @param {string} sid - RSA-encrypted AES key
       * @param {string} edt - AES-encrypted behavioral data
       */
      function startTxCaptcha(eventid, txappid, sid, edt) {
        captchaBox.style.display = 'block';
        smsCaptcha.style.display = 'none';

        loadScript('https://turing.captcha.qcloud.com/TCaptcha.js', function () {
          if (typeof TencentCaptcha === 'undefined') {
            showResult(false, 'TCaptcha.js 加载失败');
            triggerCaptchaBtn.disabled = false;
            return;
          }

          // Create Tencent captcha instance
          const captcha = new TencentCaptcha(
            txappid,
            function (res) {
              console.log('Captcha response:', res);
              if (res.ret === 0) {
                // Verification passed: build verifycode (format: KGCodeTX|{ticket,randstr,txappid})
                const verifycode =
                  'KGCodeTX|' +
                  JSON.stringify({
                    ticket: res.ticket,
                    randstr: res.randstr,
                    txappid: txappid,
                  });

                // Submit to server for verification
                fetch(
                  `/verify/user/info?eventid=${eventid}&v_type=23` +
                    `&verifycode=${encodeURIComponent(verifycode)}` +
                    `&sid=${encodeURIComponent(sid)}&edt=${encodeURIComponent(edt)}`,
                  { method: 'GET' }
                )
                  .then((r) => r.json())
                  .then((data) => {
                    console.log('Verification Result:', data);
                    showResult(true, '验证成功!');
                    triggerCaptchaBtn.style.display = 'none';
                  })
                  .catch((err) => {
                    console.error('Verification request failed:', err);
                    showResult(false, '验证码验证请求失败');
                    triggerCaptchaBtn.disabled = false;
                  });
              } else {
                // User closed captcha or verification failed
                showResult(false, '用户取消 (ret=' + res.ret + ')');
                triggerCaptchaBtn.disabled = false;
              }
            },
            { type: '', showHeader: false, ready: function () {} }
          );
          captcha.show();
        });
      }

      /**
       * ============================================================
       * SMS captcha flow (v_type=32)
       * ============================================================
       *
       * 1. Show SMS captcha input area
       * 2. Submit user-entered code to server for verification
       *
       * @param {string} eventid - verification event ID
       * @param {number} v_type - verification type
       * @param {string} sid - RSA-encrypted AES key
       * @param {string} edt - AES-encrypted behavioral data
       */
      function startSmsCaptcha(eventid, v_type, sid, edt) {
        captchaBox.style.display = 'none';
        smsCaptcha.style.display = 'block';
        smsCode.value = '';
        smsCode.focus();

        // Bind verify button click handler
        smsVerifyBtn.onclick = async function () {
          const code = smsCode.value.trim();
          if (!code) {
            alert('请输入验证码');
            return;
          }

          try {
            // Submit SMS captcha to server
            const verifyResponse = await fetch(
              `/verify/user/info?eventid=${eventid}&v_type=${v_type}` +
                `&verifycode=${encodeURIComponent(code)}` +
                `&sid=${encodeURIComponent(sid)}&edt=${encodeURIComponent(edt)}`,
              { method: 'GET' }
            );
            const verifyData = await verifyResponse.json();
            console.log('SMS Verification Result:', verifyData);
            showResult(true, '验证成功!');
          } catch (err) {
            console.error('SMS Verification request failed:', err);
            showResult(false, '验证码验证请求失败');
          }
        };
      }

      // ========== Event bindings ==========

      // Fetch verification info button
      getInfoBtn.addEventListener('click', fetchVerifyInfo);

      // Enter key on eventid input
      eventidInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') fetchVerifyInfo();
      });

      // Trigger captcha button
      triggerCaptchaBtn.addEventListener('click', triggerCaptcha);

      // ========== Page init: read eventid from URL params ==========
      (function () {
        const params = new URLSearchParams(window.location.search);
        const eventid = params.get('eventid') || params.get('ssaCode') || '';

        if (eventid) {
          // URL has eventid: auto-fill and fetch verification info
          eventidInput.value = eventid;
          fetchVerifyInfo();
        } else {
          // No eventid: focus input and wait for user entry
          eventidInput.focus();
        }
      })();
    </script>
  </body>
</html>
